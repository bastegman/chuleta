name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: numpy y requests (faster-whisper no hace falta para los tests; requests, para los de la sesion HTTP)
        run: python -m pip install --disable-pip-version-check numpy requests
      - name: Tests (falla si se ejecutan 0)
        run: python tests/run.py
      - name: Los .ps1 de _app (instalar.ps1 y, si existe, desinstalar.ps1) se parsean en Windows PowerShell 5.1
        # El mismo PowerShell que lanza INSTALAR.bat en el PC del usuario (pwsh es la 7): un error de sintaxis que en
        # macOS y Linux no se ve rompe la instalación. Corre aunque fallen los tests (es otra comprobación). El script,
        # solo en ASCII: si el runner lo guarda sin BOM, PowerShell 5.1 lo lee como ANSI.
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: powershell
        run: |
          "PowerShell $($PSVersionTable.PSVersion) ($($PSVersionTable.PSEdition))"
          if ($PSVersionTable.PSEdition -ne "Desktop" -or $PSVersionTable.PSVersion.Major -ne 5) {
            throw "se esperaba Windows PowerShell 5.1"
          }
          function Count-ParseErrors([string]$Path, [string]$Label) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($Path, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) {
              Write-Host "  ${Label}: linea $($e.Extent.StartLineNumber), columna $($e.Extent.StartColumnNumber): $($e.Message)"
            }
            return $errors.Count
          }
          # control: un fichero roto a proposito tiene que dar errores; si no, la comprobacion no vale
          $roto = Join-Path $env:RUNNER_TEMP "roto.ps1"
          Set-Content -LiteralPath $roto -Value 'if ($a) { "sin cerrar"' -Encoding UTF8
          if ((Count-ParseErrors $roto "control") -eq 0) { throw "ParseFile no detecta un error de sintaxis de prueba" }
          $files = @(Get-ChildItem -LiteralPath "_app" -Filter "*.ps1" | Sort-Object Name)
          if (-not ($files | Where-Object { $_.Name -eq "instalar.ps1" })) { throw "no encuentro _app\instalar.ps1" }
          $total = 0
          foreach ($f in $files) {
            $n = Count-ParseErrors $f.FullName "_app\$($f.Name)"
            "_app\$($f.Name): $n errores de sintaxis"
            $total += $n
          }
          if ($total -ne 0) { exit 1 }

  lint:
    # aparte de la matriz: las versiones recientes de flake8 exigen Python >= 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m flake8
      - name: Agnosticismo con la lista privada (sin el secreto NOTAS_PALABRAS_VETADAS, el test se salta)
        # Solo este paso recibe la lista: expresiones regulares separadas por comas, en Settings -> Secrets and
        # variables -> Actions -> New repository secret. Al fallar dice fichero y línea, nunca la palabra (el log de un
        # repo público es público). Los pull_request desde forks no reciben secretos: ahí también se salta.
        env:
          NOTAS_PALABRAS_VETADAS: ${{ secrets.NOTAS_PALABRAS_VETADAS }}
        working-directory: tests
        run: |
          if [ -z "$NOTAS_PALABRAS_VETADAS" ]; then
            echo "::notice title=Agnosticismo::sin el secreto NOTAS_PALABRAS_VETADAS el test de agnosticismo se salta"
          fi
          python -m unittest -v test_package.TemplatesTests.test_sin_rastro_de_clientes
