name: diag-bloqueo

# Solo diagnostico (rama fix-bloqueo): con una reunion en la carpeta, en Windows y con la ventana abierta, la API
# dejaba de contestar (E2E de instalacion-empresa, run 41208308290). Cada trabajo monta la carpeta con el _app de un
# commit y una reunion falsa, arranca server.py y sondea la API 3 minutos; si se atasca, vuelca las pilas de todos los
# hilos (py-spy y faulthandler). Solo lee el repo; deja todo como artefacto.
on:
  workflow_dispatch:
  push:
    branches: [fix-bloqueo]

permissions:
  contents: read

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ronda 1 (run 41211868287): 13 variantes sin cuelgue (ventana/sin ventana/Edge; 5 tipos de reunion; 6 commits)
          - {nombre: main-shell-defecto-previo, ref: 5c55e54ef8689e6829a15cdfa1cb692e994f21fe, modo: ventana, reunion: completa, extra: "--lanzar shell --datos-por-defecto --previo"}
          - {nombre: main-shell-completa, ref: 5c55e54ef8689e6829a15cdfa1cb692e994f21fe, modo: ventana, reunion: completa, extra: "--lanzar shell"}
          - {nombre: main-popen-previo, ref: 5c55e54ef8689e6829a15cdfa1cb692e994f21fe, modo: ventana, reunion: completa, extra: "--previo"}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          ref: ${{ matrix.ref == 'HEAD' && github.sha || matrix.ref }}
          path: app
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: "3.13"
      - name: Dependencias de la app (como el instalador) y py-spy (solo diagnostico)
        run: python -m pip install --disable-pip-version-check -r app/requirements.txt py-spy
      - name: Versiones
        run: python -m pip list --disable-pip-version-check
      - name: Reproducir y volcar pilas
        run: python scripts/diag/diag_bloqueo.py --app app --modo ${{ matrix.modo }} --reunion ${{ matrix.reunion }} --out diag-out --seconds 180 ${{ matrix.extra }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: diag-${{ matrix.nombre }}
          path: diag-out
          if-no-files-found: warn

  e2e:
    # el E2E de instalacion-empresa tal cual (instala con INSTALAR.bat y arranca la app como el usuario) y, en segundo
    # plano, un vigia que vuelca las pilas del servidor con py-spy en cuanto /api/config deja de contestar
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          ref: 67ae77b8cdfa3de8760b30733159522bcd87f135
          path: inst
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: "3.13"
      - name: numpy (build_zip importa live.py) y py-spy (solo diagnostico)
        shell: powershell
        run: python -m pip install --disable-pip-version-check numpy py-spy
      - name: Vigia en segundo plano
        shell: powershell
        run: |
          $py = (Get-Command python).Source
          Start-Process -FilePath $py -ArgumentList "$env:GITHUB_WORKSPACE\scripts\diag\vigia_e2e.py", "--out", "$env:GITHUB_WORKSPACE\vigia-out", "--minutes", "40" -WindowStyle Hidden
      - name: E2E (PowerShell 5.1)
        shell: powershell
        timeout-minutes: 26
        continue-on-error: true
        run: |
          & "$env:GITHUB_WORKSPACE\inst\scripts\e2e\lookfeel_e2e.ps1" -Repo "$env:GITHUB_WORKSPACE\inst" -Out "$env:GITHUB_WORKSPACE\e2e-out"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: diag-e2e
          path: |
            vigia-out
            e2e-out
          if-no-files-found: warn
