name: diag-bloqueo

# Ronda 2: solo el trabajo e2e, con el E2E instrumentado (fallos de Wait-Http, curl.exe, HttpWebRequest sin
# keep-alive y el ServicePoint de .NET). Solo diagnostico (rama desechable diag-correcciones, desde correcciones): con una reunion en la carpeta, en Windows y
# con la ventana abierta, la API deja de contestar (E2E de correcciones, run 41341410510: /api/config sin respuesta en
# 150 s en cada fase con la reunion falsa, el proceso sin CPU y con 25 hilos). Workflow y scripts de fix-bloqueo, con
# el _app de esta rama. Cada trabajo de diag monta la carpeta con una reunion falsa, arranca server.py y sondea la API
# 3 minutos; si se atasca, vuelca las pilas de todos los hilos (py-spy y faulthandler). El trabajo e2e es el E2E de
# esta rama con un vigia que vuelca las pilas en cuanto /api/config deja de contestar. Solo lee el repo.
on:
  workflow_dispatch:
  push:
    branches: [diag-correcciones]

permissions:
  contents: read

jobs:
  e2e:
    # el E2E de instalacion-empresa tal cual (instala con INSTALAR.bat y arranca la app como el usuario) y, en segundo
    # plano, un vigia que vuelca las pilas del servidor con py-spy en cuanto /api/config deja de contestar
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          ref: ${{ github.sha }}
          path: inst
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: "3.13"
      - name: numpy (build_zip importa live.py) y py-spy (solo diagnostico)
        shell: powershell
        run: python -m pip install --disable-pip-version-check numpy py-spy
      - name: Vigia en segundo plano
        shell: powershell
        run: |
          $py = (Get-Command python).Source
          Start-Process -FilePath $py -ArgumentList "$env:GITHUB_WORKSPACE\scripts\diag\vigia_e2e.py", "--out", "$env:GITHUB_WORKSPACE\vigia-out", "--minutes", "40" -WindowStyle Hidden
      - name: E2E (PowerShell 5.1)
        shell: powershell
        timeout-minutes: 35
        continue-on-error: true
        run: |
          & "$env:GITHUB_WORKSPACE\inst\scripts\e2e\lookfeel_e2e.ps1" -Repo "$env:GITHUB_WORKSPACE\inst" -Out "$env:GITHUB_WORKSPACE\e2e-out"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: diag-e2e
          path: |
            vigia-out
            e2e-out
          if-no-files-found: warn
