name: diag-bloqueo

# Solo diagnostico (rama fix-bloqueo): con una reunion en la carpeta, en Windows y con la ventana abierta, la API
# dejaba de contestar (E2E de instalacion-empresa, run 41208308290). Cada trabajo monta la carpeta con el _app de un
# commit y una reunion falsa, arranca server.py y sondea la API 3 minutos; si se atasca, vuelca las pilas de todos los
# hilos (py-spy y faulthandler). Solo lee el repo; deja todo como artefacto.
on:
  workflow_dispatch:
  push:
    branches: [fix-bloqueo]

permissions:
  contents: read

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {nombre: main-ventana-completa, ref: 5c55e54ef8689e6829a15cdfa1cb692e994f21fe, modo: ventana, reunion: completa}
          - {nombre: main-ventana-sinmarca, ref: 5c55e54ef8689e6829a15cdfa1cb692e994f21fe, modo: ventana, reunion: completa-sinmarca}
          - {nombre: main-ventana-solowav, ref: 5c55e54ef8689e6829a15cdfa1cb692e994f21fe, modo: ventana, reunion: solo-wav}
          - {nombre: main-ventana-vocab, ref: 5c55e54ef8689e6829a15cdfa1cb692e994f21fe, modo: ventana, reunion: vocab}
          - {nombre: main-ventana-hablantes, ref: 5c55e54ef8689e6829a15cdfa1cb692e994f21fe, modo: ventana, reunion: hablantes}
          - {nombre: main-ventana-ninguna, ref: 5c55e54ef8689e6829a15cdfa1cb692e994f21fe, modo: ventana, reunion: ninguna}
          - {nombre: main-sinventana-completa, ref: 5c55e54ef8689e6829a15cdfa1cb692e994f21fe, modo: sin-ventana, reunion: completa}
          - {nombre: main-edge-completa, ref: 5c55e54ef8689e6829a15cdfa1cb692e994f21fe, modo: edge, reunion: completa}
          - {nombre: fc31276-ventana-completa, ref: fc312767680b52f3745a68370a15ba431405b0cf, modo: ventana, reunion: completa}
          - {nombre: a53f9b1-ventana-completa, ref: a53f9b1523e08bb0d05f6f093b1b34a85f80a84a, modo: ventana, reunion: completa}
          - {nombre: 4f877f9-ventana-completa, ref: 4f877f9fe36666a21359546773ea47ba38255cfd, modo: ventana, reunion: completa}
          - {nombre: c5bbe97-ventana-completa, ref: c5bbe9729ad5d512b4d8c73ceb33dad36ea5ceba, modo: ventana, reunion: completa}
          - {nombre: 97f9378-ventana-completa, ref: 97f937867f047d7900c92d3bced9f8ca230a834a, modo: ventana, reunion: completa}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          ref: ${{ matrix.ref == 'HEAD' && github.sha || matrix.ref }}
          path: app
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: "3.13"
      - name: Dependencias de la app (como el instalador) y py-spy (solo diagnostico)
        run: python -m pip install --disable-pip-version-check -r app/requirements.txt py-spy
      - name: Versiones
        run: python -m pip list --disable-pip-version-check
      - name: Reproducir y volcar pilas
        run: python scripts/diag/diag_bloqueo.py --app app --modo ${{ matrix.modo }} --reunion ${{ matrix.reunion }} --out diag-out --seconds 180
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: diag-${{ matrix.nombre }}
          path: diag-out
          if-no-files-found: warn
