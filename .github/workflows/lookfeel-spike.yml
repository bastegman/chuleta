name: lookfeel-spike

# Medición en Windows (rama look-and-feel): qué icono y qué AppUserModelID lleva la ventana de la app según se abra
# con `msedge --app` (scripts/lookfeel_spike.py) o con una ventana propia de pywebview/WebView2
# (scripts/lookfeel_webview_probe.py). No toca el repo ni publica nada: solo artefactos con el informe y los PNG.
on:
  workflow_dispatch:
  push:
    branches: [look-and-feel]

permissions:
  contents: read

jobs:
  edge:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: "3.13"
      - name: Entorno (Edge, WebView2, DPI)
        shell: pwsh
        run: |
          (Get-CimInstance Win32_OperatingSystem).Caption + " " + (Get-CimInstance Win32_OperatingSystem).Version
          foreach ($p in "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe", "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe") {
            if (Test-Path $p) { "Edge: $p " + (Get-Item $p).VersionInfo.ProductVersion }
          }
          foreach ($k in "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}",
                         "HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}") {
            if (Test-Path $k) { "WebView2 Runtime: " + (Get-ItemProperty $k).pv }
          }
          Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
      - run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Medir msedge --app (4 variantes)
        run: python scripts/lookfeel_spike.py spike-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: lookfeel-edge
          path: spike-out
          if-no-files-found: warn

  webview:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        netfx: ["0", "1"]  # 1: pythonnet.load("netfx") antes de importar webview
    env:
      NOTAS_PROBE_NETFX: ${{ matrix.netfx }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: pip install pywebview (sin compilador en el runner; se ve que rueda se construye)
        # --only-binary=:all: NO vale: proxy_tools (dependencia de pywebview) solo publica sdist (Python puro) y pip
        # retrocedia hasta pywebview 3.4 (2020), que casca con pythonnet 3 (NullReferenceException en set_Text)
        run: |
          python -m pip install --disable-pip-version-check -v numpy pywebview 2>&1 | Select-String -Pattern "Building wheel|Created wheel|Successfully installed|Using cached|Downloading" | ForEach-Object { $_.Line.Trim() }
          python -m pip freeze
          where.exe cl.exe 2>$null; if ($LASTEXITCODE -ne 0) { "sin cl.exe en el PATH del runner" }
          exit 0
      - name: Ventana propia (pywebview) · AUMID e iconos del HWND
        run: python scripts/lookfeel_webview_probe.py spike-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: lookfeel-webview-py${{ matrix.python }}-netfx${{ matrix.netfx }}
          path: spike-out
          if-no-files-found: warn
