name: reunion-windows

# Pruebas de escritorio en Windows (ventana de Teams simulada, aviso flotante, captura de pantalla, pywin32 sin
# Outlook). Se lanza a mano (Actions -> reunion-windows -> Run workflow) y con cada push a main, o a la rama
# reunion-teams-outlook, que toque la app, los tests o este workflow; los artefactos llevan las capturas.
on:
  workflow_dispatch:
  push:
    branches: [main, reunion-teams-outlook]
    paths:
      - "_app/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/reunion-windows.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      NOTAS_ARTEFACTOS: ${{ github.workspace }}\artefactos
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: "3.12"
      - name: numpy (tests) y pywin32 (Outlook, opcional en la app)
        run: python -m pip install --disable-pip-version-check numpy pywin32==312
      - name: Pantalla del runner (para interpretar las capturas)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::AllScreens | Format-List DeviceName, Bounds, WorkingArea, Primary
          [System.Environment]::OSVersion.VersionString
          python -c "import tkinter, sys; print('tk', tkinter.TkVersion, sys.version)"
      - name: Tests (toda la suite, incluidos los de Windows)
        run: python tests/run.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: reunion-windows-artefactos
          path: artefactos
          if-no-files-found: warn
