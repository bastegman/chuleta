name: windows-real

# Pruebas en Windows de verdad que la suite de tests.yml no cubre sola (auditoria final, grupo Windows): el formato
# regional español del usuario (Set-Culture es-ES) para el filtro de Outlook (P1-07), con la zona horaria de Madrid
# (las horas de Outlook por pywin32, fix-calendario), y la ventana propia (pywebview
# sobre WebView2) ante los mensajes con los que Windows apaga o cierra la sesion (P1-09) y sin WebView2 (P2-35). El
# aviso con PowerShell 5.1 (P1-01) corre aqui y en tests.yml. test_ocultar_captura_windows: la ventana real con WebView2
# lleva WDA_EXCLUDEFROMCAPTURE y no sale en una captura de pantalla (ocultar al compartir, msg 1242). Se lanza a mano (Actions -> windows-real -> Run
# workflow) y con cada push a main, o a la rama fix-windows, que toque la app, los tests o este workflow (P2-38); deja
# server.log y los resultados como artefacto. Solo lee el repo.
on:
  workflow_dispatch:
  push:
    branches: [main, fix-windows]
    paths:
      - "_app/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/windows-real.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NOTAS_ARTEFACTOS: ${{ github.workspace }}\artefactos
      NOTAS_LOCALE_ESPERADO: es-ES
      NOTAS_VENTANA_REAL: "1"
      NOTAS_EXIGE_PYWIN32: "1"  # aqui pywin32 se instala: si no se importa, los tests del calendario fallan
      NOTAS_TZ_PRUEBA: "1"  # la zona de Madrid (paso de abajo): las horas de Outlook no se mueven (fix-calendario)
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: "3.13"
      - name: numpy y requests (tests), pywebview (la ventana) y pywin32 (Outlook, opcional en la app)
        run: python -m pip install --disable-pip-version-check numpy requests pywebview==6.2.1 pywin32==312
      - name: Formato regional español y zona horaria de Madrid (lo leen los procesos que arrancan despues)
        shell: powershell
        run: |
          Set-Culture es-ES
          Set-TimeZone -Id "Romance Standard Time"
          Get-TimeZone | Format-List Id, BaseUtcOffset, SupportsDaylightSavingTime
          [System.Environment]::OSVersion.VersionString
          Get-ItemProperty 'HKCU:\Control Panel\International' | Format-List LocaleName, sShortDate, sTimeFormat
      - name: Tests (toda la suite, con la ventana real)
        run: python tests/run.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: windows-real-artefactos
          path: artefactos
          if-no-files-found: warn
