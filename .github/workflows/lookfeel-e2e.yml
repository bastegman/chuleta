name: lookfeel-e2e

# E2E real en Windows (rama renombrado-chuleta): zip -> INSTALAR.bat en modo ventana (PowerShell 5.1, como en el PC
# del usuario) -> la app abre su ventana con el titulo «Chuleta» -> acceso directo -> Apagar -> segunda instalacion
# sobre una copia con el acceso directo antiguo «Notas» (lo detecta, actualiza y renombra) -> tercera con los dos
# accesos directos (conserva el antiguo) -> instalacion que falla a proposito. Capturas de pantalla cada 5 s. Solo lee
# el repo; deja todo como artefacto.
on:
  workflow_dispatch:
  push:
    # main y las ramas de trabajo del instalador, solo cuando el push toca lo que va en el zip o lo que lo prueba (un
    # cambio de documentación no gasta los ~10 min de Windows). A mano: Actions -> lookfeel-e2e -> Run workflow.
    branches: [main, renombrado-chuleta, instalacion-empresa]
    paths:
      - "_app/**"
      - "INSTALAR.bat"
      - "ABRIR CHULETA.bat"
      - "LEEME.txt"
      - "LICENSE"
      - "requirements.txt"
      - "scripts/build_zip.py"
      - "scripts/e2e/**"
      - "scripts/lookfeel_spike.py"
      - ".github/workflows/lookfeel-e2e.yml"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: "3.13"
      - name: numpy (build_zip importa live.py)
        shell: powershell
        run: python -m pip install --disable-pip-version-check numpy
      - name: E2E (PowerShell 5.1)
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\e2e\lookfeel_e2e.ps1" -Repo "$env:GITHUB_WORKSPACE" -Out "$env:GITHUB_WORKSPACE\e2e-out"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: lookfeel-e2e
          path: e2e-out
          if-no-files-found: warn
